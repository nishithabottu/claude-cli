[project]
name = "claude-pipe"
version = "0.1.0"
description = "A pip-installable Python CLI that pipes stdin into Claude with Pydantic-validated structured outputs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishitha Bottu", email = "brnishitha@gmail.com" }]
keywords = ["anthropic", "claude", "cli", "llm", "pydantic", "structured-outputs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/nishithabottu/claude-cli"
Repository = "https://github.com/nishithabottu/claude-cli"
Issues = "https://github.com/nishithabottu/claude-cli/issues"

[project.scripts]
claude-cli = "claude_cli.__main__:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "claude_cli"
